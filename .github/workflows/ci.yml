name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m py_compile docksteady
      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh
      - name: shellcheck
        run: shellcheck install.sh uninstall.sh
